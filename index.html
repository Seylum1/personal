            <div style={{ display: "flex", gap: 10, marginTop: 24, justifyContent: "flex-end" }}>
              <button onClick={() => { setShowClassBForm(false); setClassBForm(EMPTY_CLASSB); setEditClassBId(null); }} style={btnSecondary}>Cancel</button>
              <button onClick={saveClassBContract} disabled={!classBForm.start || !classBForm.end || classBForm.start > classBForm.end}
                style={{ ...btnPrimary(!classBForm.start || !classBForm.end || classBForm.start > classBForm.end), background: (!classBForm.start || !classBForm.end || classBForm.start > classBForm.end) ? "#2a1a4a" : "#a78bfa", color: (!classBForm.start || !classBForm.end || classBForm.start > classBForm.end) ? C.faint : C.bg }}>
                {editClassBId !== null ? "Save Contract" : "Add Contract"}
              </button>
            </div>
          </div>
        </ModalOverlay>
      )}
      {showForm && (
        <ModalOverlay>
          <div style={{ background: C.surface, border: `2px solid ${C.gold}`, borderRadius: 14, padding: 28, width: "100%", maxWidth: 520 }}>
            <h2 style={{ color: C.gold, margin: "0 0 22px", fontSize: 17, fontWeight: 800 }}>{editId ? "Edit Deliverable" : "New Deliverable"}</h2>
            <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
              <Field label="Title *">     <TextInput value={form.title}       onChange={v => setForm(x => ({ ...x, title: v }))}       placeholder="Deliverable title" /></Field>
              <Field label="Description"><TextInput value={form.description} onChange={v => setForm(x => ({ ...x, description: v }))} placeholder="Brief description" /></Field>
              <Field label="Due Date">   <TextInput type="date" value={form.dueDate} onChange={v => setForm(x => ({ ...x, dueDate: v }))} /></Field>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
                <Field label="Status">  <Select value={form.status}   onChange={v => setForm(x => ({ ...x, status: v }))}   options={STATUSES} /></Field>
                <Field label="Priority"><Select value={form.priority} onChange={v => setForm(x => ({ ...x, priority: v }))} options={PRIORITIES} /></Field>
              </div>
              <Field label="Department"><Select value={form.department} onChange={v => setForm(x => ({ ...x, department: v }))} options={DEPARTMENTS} placeholder="— Select Department —" /></Field>
              <Field label="Notes"><textarea value={form.notes} onChange={e => setForm(x => ({ ...x, notes: e.target.value }))} rows={3} placeholder="Additional notes..." style={{ ...fieldStyle, resize: "vertical" }} /></Field>
            </div>
            <div style={{ display: "flex", gap: 10, marginTop: 24, justifyContent: "flex-end" }}>
              <button onClick={() => { setShowForm(false); setForm(EMPTY_FORM); setEditId(null); }} style={btnSecondary}>Cancel</button>
              <button onClick={saveDeliverable} disabled={!form.title.trim()} style={btnPrimary(!form.title.trim())}>{editId ? "Save Changes" : "Add Deliverable"}</button>
            </div>
          </div>
        </ModalOverlay>
      )}

      {phaseForm && (
        <ModalOverlay>
          <div style={{ background: C.surface, border: `2px solid ${C.blue}`, borderRadius: 14, padding: 28, width: "100%", maxWidth: 460 }}>

            <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
              <Field label="Phase Name *"><TextInput value={phaseData.name}      onChange={v => setPhaseData(x => ({ ...x, name: v }))}      placeholder="e.g. Planning, Approval, Execution" /></Field>
              <Field label="Due Date">   <TextInput type="date" value={phaseData.dueDate} onChange={v => setPhaseData(x => ({ ...x, dueDate: v }))} /></Field>
              <Field label="Status">     <Select value={phaseData.status}    onChange={v => setPhaseData(x => ({ ...x, status: v }))}    options={STATUSES} /></Field>
              <Field label="Waiting On">
                <TextInput value={phaseData.waitingOn} onChange={v => setPhaseData(x => ({ ...x, waitingOn: v }))} placeholder="Name or role (leave blank if not blocked)" />
                <div style={{ color: C.faint, fontSize: 11, marginTop: 5 }}>Fill this in if progress is blocked pending someone else's action.</div>
              </Field>
            </div>
            <div style={{ display: "flex", gap: 10, marginTop: 24, justifyContent: "flex-end" }}>
              <button onClick={() => { setPhaseForm(null); setPhaseData(EMPTY_PHASE); }} style={btnSecondary}>Cancel</button>
              <button onClick={savePhase} disabled={!phaseData.name.trim()} style={{ ...btnPrimary(!phaseData.name.trim()), background: phaseData.name.trim() ? C.blue : "#1e3a5f", color: phaseData.name.trim() ? C.bg : C.muted }}>{phaseForm.phaseIdx === null ? "Add Phase" : "Save Phase"}</button>
            </div>
          </div>
        </ModalOverlay>
      )}

      {confirmDelete && (
        <ModalOverlay>
          <div style={{ background: C.surface, border: "2px solid #f87171", borderRadius: 12, padding: 32, maxWidth: 380, width: "100%", textAlign: "center" }}>
            <div style={{ color: "#f87171", fontSize: 17, fontWeight: 800, marginBottom: 10 }}>Delete Deliverable?</div>
            <div style={{ color: C.blue, fontSize: 14, marginBottom: 24 }}>All phases will also be removed. This cannot be undone.</div>
            <div style={{ display: "flex", gap: 10, justifyContent: "center" }}>
              <button onClick={() => setConfirmDelete(null)}            style={btnSecondary}>Cancel</button>
              <button onClick={() => removeDeliverable(confirmDelete)} style={{ background: "#f87171", color: "#fff", border: "none", borderRadius: 6, padding: "9px 24px", cursor: "pointer", fontWeight: 700 }}>Delete</button>
            </div>
          </div>
        </ModalOverlay>
      )}

      {showRecurringForm && (
        <ModalOverlay>
          <div style={{ background: C.surface, border: `2px solid ${C.gold}`, borderRadius: 14, padding: 28, width: "100%", maxWidth: 460 }}>
            <h2 style={{ color: C.gold, margin: "0 0 22px", fontSize: 17, fontWeight: 800 }}>{editRecurringId !== null ? "Edit Recurring Duty" : "New Recurring Duty"}</h2>
            <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
              <Field label="Duty Name *">
                <TextInput value={recurringForm.label} onChange={v => setRecurringForm(x => ({ ...x, label: v }))} placeholder="e.g. Tuesday Parade Night, Monthly Standing Order" />
              </Field>
              <Field label="Days of Week">
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                  {["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map((d, i) => {
                    const checked = recurringForm.daysOfWeek.includes(i);
                    return (
                      <button key={i} onClick={() => setRecurringForm(x => ({ ...x, daysOfWeek: checked ? x.daysOfWeek.filter(v => v !== i) : [...x.daysOfWeek, i] }))}
                        style={{ background: checked ? C.gold : C.bg, color: checked ? C.bg : C.faint, border: `1px solid ${checked ? C.gold : C.border}`, borderRadius: 6, padding: "6px 12px", cursor: "pointer", fontWeight: 700, fontSize: 13 }}>
                        {d}
                      </button>
                    );
                  })}
                </div>
              </Field>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
                <Field label="Start Date (optional)"><TextInput type="date" value={recurringForm.startDate} onChange={v => setRecurringForm(x => ({ ...x, startDate: v }))} /></Field>
                <Field label="End Date (optional)">  <TextInput type="date" value={recurringForm.endDate}   onChange={v => setRecurringForm(x => ({ ...x, endDate: v }))} /></Field>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
                <Field label="Badge Emoji">
                  <TextInput value={recurringForm.badge} onChange={v => setRecurringForm(x => ({ ...x, badge: v }))} placeholder="⚓" />
                </Field>
                <Field label="Colour">
                  <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                    <input type="color" value={recurringForm.color} onChange={e => setRecurringForm(x => ({ ...x, color: e.target.value }))}
                      style={{ width: 40, height: 36, border: "none", background: "none", cursor: "pointer" }} />
                    <span style={{ color: C.muted, fontSize: 12 }}>{recurringForm.color}</span>
                  </div>
                </Field>
              </div>
            </div>
            <div style={{ display: "flex", gap: 10, marginTop: 24, justifyContent: "flex-end" }}>
              <button onClick={() => { setShowRecurringForm(false); setRecurringForm(EMPTY_RECURRING); setEditRecurringId(null); }} style={btnSecondary}>Cancel</button>
              <button onClick={saveRecurring} disabled={!recurringForm.label.trim() || recurringForm.daysOfWeek.length === 0} style={btnPrimary(!recurringForm.label.trim() || recurringForm.daysOfWeek.length === 0)}>
                {editRecurringId !== null ? "Save" : "Add Duty"}
              </button>
            </div>
          </div>
        </ModalOverlay>
      )}
    </div>
  );
}

    ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
  </script>
</body>
</html>
